<line x1="270" y1="329" x2="320" y2="329" stroke="#111827" stroke-width="1.6"/><polygon points="328,329 319,324 319,334" fill="#111827"/>
<line x1="500" y1="329" x2="520" y2="329" stroke="#111827" stroke-width="1.6"/><polygon points="528,329 519,324 519,334" fill="#111827"/>
<line x1="700" y1="329" x2="720" y2="329" stroke="#111827" stroke-width="1.6"/><polygon points="728,329 719,324 719,334" fill="#111827"/>
<line x1="900" y1="329" x2="935" y2="329" stroke="#111827" stroke-width="1.6"/><polygon points="943,329 934,324 934,334" fill="#111827"/>
<line x1="1040" y1="362" x2="1040" y2="392" stroke="#111827" stroke-width="1.6"/><line x1="1040" y1="392" x2="170" y2="392" stroke="#111827" stroke-width="1.6"/><line x1="170" y1="392" x2="170" y2="431" stroke="#111827" stroke-width="1.6"/><polygon points="170,440 165,431 175,431" fill="#111827"/>
<line x1="270" y1="477" x2="320" y2="477" stroke="#111827" stroke-width="1.6"/><polygon points="328,477 319,472 319,482" fill="#111827"/>
<line x1="530" y1="477" x2="580" y2="477" stroke="#111827" stroke-width="1.6"/><polygon points="588,477 579,472 579,482" fill="#111827"/>
<line x1="790" y1="477" x2="840" y2="477" stroke="#111827" stroke-width="1.6"/><polygon points="848,477 839,472 839,482" fill="#111827"/>
<line x1="992" y1="512" x2="992" y2="548" stroke="#111827" stroke-width="1.6"/><line x1="992" y1="548" x2="645" y2="548" stroke="#111827" stroke-width="1.6"/><line x1="645" y1="548" x2="645" y2="587" stroke="#111827" stroke-width="1.6"/><polygon points="645,596 640,587 650,587" fill="#111827"/>
<line x1="240" y1="633" x2="290" y2="633" stroke="#111827" stroke-width="1.6"/><polygon points="298,633 289,628 289,638" fill="#111827"/>
<line x1="490" y1="633" x2="540" y2="633" stroke="#111827" stroke-width="1.6"/><polygon points="548,633 539,628 539,638" fill="#111827"/>
<line x1="740" y1="633" x2="790" y2="633" stroke="#111827" stroke-width="1.6"/><polygon points="798,633 789,628 789,638" fill="#111827"/>
<line x1="980" y1="633" x2="1002" y2="633" stroke="#111827" stroke-width="1.6"/><polygon points="1010,633 1001,628 1001,638" fill="#111827"/><line x1="395" y1="668" x2="395" y2="676" stroke="#111827" stroke-width="1.6"/>
  <text x="40" y="744" font-size="12" fill="#9ca3af">Batch and streaming ingestion converge on one downstream path: one record is one row.</text>
</svg>
