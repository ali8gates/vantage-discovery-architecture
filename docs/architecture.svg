<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#111827">Semantic Discovery Platform: Reference Architecture</text>
  <text x="40" y="74" font-size="14" fill="#6b7280">Conceptual view. Generic component names only.</text>

  <!-- Layer bands -->
  <g fill="#f9fafb" stroke="#e5e7eb">
    <rect x="40" y="100" width="1120" height="140" rx="10"/>
    <rect x="40" y="256" width="1120" height="130" rx="10"/>
    <rect x="40" y="402" width="1120" height="140" rx="10"/>
    <rect x="40" y="558" width="1120" height="160" rx="10"/>
  </g>
  <g font-size="13" font-weight="700" fill="#9ca3af">
    <text x="56" y="122">1. INGESTION</text>
    <text x="56" y="278">2. EMBEDDING</text>
    <text x="56" y="424">3. INDEXING</text>
    <text x="56" y="580">4. SERVING</text>
  </g>

  <!-- Ingestion row -->
  <g stroke="#111827" stroke-width="1.5" fill="#ffffff">
    <rect x="70" y="140" width="180" height="70" rx="8"/>
    <rect x="300" y="140" width="180" height="70" rx="8"/>
    <rect x="530" y="140" width="180" height="70" rx="8"/>
    <rect x="760" y="140" width="180" height="70" rx="8"/>
    <rect x="985" y="140" width="150" height="70" rx="8"/>
  </g>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <text x="160" y="170">Catalog Source</text><text x="160" y="190" font-size="12" fill="#6b7280">batch or stream</text>
    <text x="390" y="170">Write API</text><text x="390" y="190" font-size="12" fill="#6b7280">single record path</text>
    <text x="620" y="170">Schema Mapping</text><text x="620" y="190" font-size="12" fill="#6b7280">to common schema</text>
    <text x="850" y="170">Validation</text><text x="850" y="190" font-size="12" fill="#6b7280">reject and report</text>
    <text x="1060" y="170">Object Store</text><text x="1060" y="190" font-size="12" fill="#6b7280">columnar files</text>
  </g>

  <!-- Embedding row -->
  <g stroke="#111827" stroke-width="1.5" fill="#ffffff">
    <rect x="70" y="296" width="200" height="66" rx="8"/>
    <rect x="330" y="296" width="170" height="66" rx="8"/>
    <rect x="530" y="296" width="170" height="66" rx="8"/>
    <rect x="730" y="296" width="170" height="66" rx="8"/>
    <rect x="945" y="296" width="190" height="66" rx="8"/>
  </g>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <text x="170" y="324">Model Router</text><text x="170" y="344" font-size="12" fill="#6b7280">provider abstraction</text>
    <text x="415" y="332">Provider A</text>
    <text x="615" y="332">Provider B</text>
    <text x="815" y="332">Provider C</text>
    <text x="1040" y="324">Vector Output</text><text x="1040" y="344" font-size="12" fill="#6b7280">ids and vectors</text>
  </g>

  <!-- Indexing row -->
  <g stroke="#111827" stroke-width="1.5" fill="#ffffff">
    <rect x="70" y="442" width="200" height="70" rx="8"/>
    <rect x="330" y="442" width="200" height="70" rx="8"/>
    <rect x="590" y="442" width="200" height="70" rx="8"/>
    <rect x="850" y="442" width="285" height="70" rx="8"/>
  </g>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <text x="170" y="472">Orchestrated Workflow</text><text x="170" y="492" font-size="12" fill="#6b7280">scheduled and triggered</text>
    <text x="430" y="472">Index Build</text><text x="430" y="492" font-size="12" fill="#6b7280">columnar to binary</text>
    <text x="690" y="472">Merge and Dedupe</text><text x="690" y="492" font-size="12" fill="#6b7280">deletes applied</text>
    <text x="992" y="472">Versioned Index Set</text><text x="992" y="492" font-size="12" fill="#6b7280">incremental to full rebuild</text>
  </g>

  <!-- Serving row -->
  <g stroke="#111827" stroke-width="1.5" fill="#ffffff">
    <rect x="70" y="600" width="170" height="66" rx="8"/>
    <rect x="300" y="598" width="190" height="70" rx="8"/>
    <rect x="300" y="676" width="190" height="30" rx="6"/>
    <rect x="550" y="598" width="190" height="70" rx="8"/>
    <rect x="800" y="598" width="180" height="70" rx="8"/>
    <rect x="1010" y="598" width="125" height="70" rx="8"/>
  </g>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <text x="155" y="630">Client</text><text x="155" y="650" font-size="12" fill="#6b7280">via load balancer</text>
    <text x="395" y="628">Query Service</text><text x="395" y="648" font-size="12" fill="#6b7280">read path</text>
    <text x="395" y="696" font-size="12" fill="#6b7280">Management Service</text>
    <text x="645" y="628">Index Registry</text><text x="645" y="648" font-size="12" fill="#6b7280">what is live</text>
    <text x="890" y="628">Shard Nodes</text><text x="890" y="648" font-size="12" fill="#6b7280">fan out and rank</text>
    <text x="1072" y="628">Metadata</text><text x="1072" y="648" font-size="12" fill="#6b7280">store</text>
  </g>

  <!-- Arrows -->
  
  <line x1="250" y1="175" x2="290" y2="175" stroke="#111827" stroke-width="1.6"/><polygon points="298,175 289,170 289,180" fill="#111827"/>
<line x1="480" y1="175" x2="520" y2="175" stroke="#111827" stroke-width="1.6"/><polygon points="528,175 519,170 519,180" fill="#111827"/>
<line x1="710" y1="175" x2="750" y2="175" stroke="#111827" stroke-width="1.6"/><polygon points="758,175 749,170 749,180" fill="#111827"/>
<line x1="940" y1="175" x2="975" y2="175" stroke="#111827" stroke-width="1.6"/><polygon points="983,175 974,170 974,180" fill="#111827"/>
